[project]
name = "job-radar"
version = "0.1.0"
description = "Daily radar of fresh job postings from public ATS boards (Greenhouse, Lever, Ashby)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.8",
    "typer>=0.29.1",
]

[project.scripts]
radar = "job_radar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
